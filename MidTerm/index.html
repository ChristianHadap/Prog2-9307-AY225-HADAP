<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Report Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subheader {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        .card-title {
            color: #667eea;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .card-value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .card-subtitle {
            color: #999;
            font-size: 0.85em;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .chart-title {
            color: #333;
            font-size: 1.3em;
            margin-bottom: 20px;
            font-weight: 600;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bar-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bar-label {
            min-width: 150px;
            font-size: 0.9em;
            color: #333;
            font-weight: 500;
        }

        .bar {
            flex-grow: 1;
            height: 30px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }

        .bar-value {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 0.85em;
            font-weight: 600;
        }

        .top-section {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .top-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .top-item:last-child {
            border-bottom: none;
        }

        .top-label {
            font-size: 1.1em;
            color: #333;
            font-weight: 500;
        }

        .top-value {
            font-size: 1.2em;
            color: #667eea;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .bar-label {
                min-width: 100px;
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Analytics Report Dashboard</h1>
            <p class="subheader">Video Game Sales Data Analysis - VGChartz 2024</p>
        </header>

        <div id="content" class="loading">
            <p>Loading analytics data...</p>
        </div>

        <footer>
            <p>Generated from vgchartz-2024.csv | Last Updated: <span id="timestamp"></span></p>
        </footer>
    </div>

    <script>
        // Mock data for demonstration - replace with actual data from Node.js
        const reportData = {
            totalGames: 16928,
            totalSales: 1234.56,
            avgCriticScore: 8.45,
            scoredGames: 12450,
            topGenre: {
                name: 'Action',
                count: 2156
            },
            topPublisher: {
                name: 'Electronic Arts',
                count: 856
            },
            genreDistribution: [
                { genre: 'Action', count: 2156 },
                { genre: 'Shooter', count: 1890 },
                { genre: 'Sports', count: 1654 },
                { genre: 'Role-Playing', count: 1234 },
                { genre: 'Racing', count: 987 }
            ],
            topPublishers: [
                { publisher: 'Electronic Arts', count: 856 },
                { publisher: 'Activision', count: 734 },
                { publisher: 'Rockstar Games', count: 567 },
                { publisher: 'Microsoft', count: 456 },
                { publisher: 'Sony', count: 389 }
            ]
        };

        function initializeDashboard(data) {
            const content = document.getElementById('content');
            content.innerHTML = '';

            // Summary Cards
            const summaryHTML = `
                <div class="summary-grid">
                    <div class="card">
                        <div class="card-title">Total Games</div>
                        <div class="card-value">${data.totalGames.toLocaleString()}</div>
                        <div class="card-subtitle">Games in database</div>
                    </div>
                    <div class="card">
                        <div class="card-title">Total Sales</div>
                        <div class="card-value">$${data.totalSales.toFixed(2)}M</div>
                        <div class="card-subtitle">Worldwide sales</div>
                    </div>
                    <div class="card">
                        <div class="card-title">Avg Critic Score</div>
                        <div class="card-value">${data.avgCriticScore.toFixed(2)}</div>
                        <div class="card-subtitle">Out of ${data.scoredGames.toLocaleString()} games</div>
                    </div>
                </div>
            `;
            content.innerHTML += summaryHTML;

            // Top Performers
            const topHTML = `
                <div class="top-section">
                    <div class="chart-title">Top Performers</div>
                    <div class="top-item">
                        <span class="top-label">🎮 Top Genre</span>
                        <span class="top-value">${data.topGenre.name} (${data.topGenre.count} games)</span>
                    </div>
                    <div class="top-item">
                        <span class="top-label">🏢 Top Publisher</span>
                        <span class="top-value">${data.topPublisher.name} (${data.topPublisher.count} games)</span>
                    </div>
                </div>
            `;
            content.innerHTML += topHTML;

            // Charts
            let chartsHTML = '<div class="charts-grid">';

            // Genre Distribution
            chartsHTML += `
                <div class="chart-container">
                    <div class="chart-title">Genre Distribution</div>
                    <div class="bar-chart">
                        ${data.genreDistribution.map(item => {
                            const maxCount = Math.max(...data.genreDistribution.map(g => g.count));
                            const percentage = (item.count / maxCount) * 100;
                            return `
                                <div class="bar-item">
                                    <div class="bar-label">${item.genre}</div>
                                    <div class="bar" style="width: ${percentage}%">
                                        <div class="bar-value">${item.count}</div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;

            // Top Publishers
            chartsHTML += `
                <div class="chart-container">
                    <div class="chart-title">Top 5 Publishers</div>
                    <div class="bar-chart">
                        ${data.topPublishers.slice(0, 5).map(item => {
                            const maxCount = Math.max(...data.topPublishers.map(p => p.count));
                            const percentage = (item.count / maxCount) * 100;
                            return `
                                <div class="bar-item">
                                    <div class="bar-label">${item.publisher}</div>
                                    <div class="bar" style="width: ${percentage}%">
                                        <div class="bar-value">${item.count}</div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;

            chartsHTML += '</div>';
            content.innerHTML += chartsHTML;

            // Set timestamp
            document.getElementById('timestamp').textContent = new Date().toLocaleString();
        }

        // Try to load actual data from JSON file
        fetch('report_data.json')
            .then(response => response.json())
            .then(data => initializeDashboard(data))
            .catch(error => {
                console.warn('Using mock data:', error);
                initializeDashboard(reportData);
            });
    </script>
</body>
</html>
